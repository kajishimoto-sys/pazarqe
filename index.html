$('pf').onsubmit=async function(e){

    if(vraw&&!vid){toast(t.badVideo,3500);return}
    if(pt=='fixed'&&!(pr>0)){toast(t.needPrice,3000);return}
    var urls=[];
    for(var i=0;i<PICS.length;i++){
      if(PICS[i].u){urls.push(PICS[i].u);continue}
      var big=await resize(PICS[i].f,1280,.82),small=await resize(PICS[i].f,480,.75),base=U.id+'/'+crypto.randomUUID();
      var up=await sb.storage.from('listing-photos').upload(base+'.jpg',big,{contentType:'image/jpeg'});

      uploaded.push(base+'.jpg');
      var up2=await sb.storage.from('listing-photos').upload(base+'_t.jpg',small,{contentType:'image/jpeg'});
      if(!up2.error)uploaded.push(base+'_t.jpg');
      urls.push(sb.storage.from('listing-photos').getPublicUrl(base+'.jpg').data.publicUrl);

    var row={title:String(f.get('title')).trim(),price:pr,category:f.get('cat'),sub:f.get('sub')||null,kind:f.get('kind'),price_type:pt,currency:f.get('cur')=='MKD'?'MKD':'EUR',wa:!!f.get('wa'),vb:!!f.get('vb'),video:vid||null,city:+f.get('city'),phone:String(f.get('phone')).trim(),description:String(f.get('desc')).trim(),cond:f.get('cond'),extra:xv(f),image_url:urls[0]||null,images:urls};
    var r=EDIT?await sb.from('listings').update(row).eq('id',EDIT.id).select().single():await sb.from('listings').insert(row).select().single();
    if(r.error)throw r.error;
    var wasEdit=!!EDIT;

      var gone=ORIG.filter(function(u){return urls.indexOf(u)<0});
      if(gone.length)sb.storage.from('listing-photos').remove(photoPaths(gone));
      var ix=D.indexOf(EDIT);if(ix>-1)D[ix]=mapRow(r.data);
    }else{D.unshift(mapRow(r.data));cat='all';view='all'}
    var nm=mapRow(r.data);
    EDIT=null;PICS=[];ORIG=[];$('pf').reset();ptUI();$('form').close();labels();render();
    if(nm.hid){toast(wasEdit?t.upd:t.done);return}
    location.href=listingUrl(nm)+'?'+(wasEdit?'saved':'posted')+'=1&v='+Date.now()+(L=='mk'?'':'&lang='+L);
  }catch(err){
    if(uploaded.length)sb.storage.from('listing-photos').remove(uploaded);
    var m=(err&&err.message)||'';
    toast(/suspended/i.test(m)?t.susp:/limit/i.test(m)?t.limit:t.err,3500);
  }finally{btn.disabled=false}
};

<script>
(function(){
  var F=document.getElementById('form'),A=document.getElementById('auth'),C=document.getElementById('acc'),S=document.getElementById('sp');
  if(!F||!A||!C||!S||!history.pushState)return;
  var ROUTES=['/post','/login','/register','/account','/search'];
  function isRoute(p){return ROUTES.indexOf(p)>-1}
  function patch(d,pathFn){
    var show=d.showModal.bind(d);
    d.classList.add('pg');
    d.showModal=function(){
      if(!d.open)show();
      var path=pathFn();
      if(location.pathname===path)return;
      var st={pg:d.id};
      if(isRoute(location.pathname))history.replaceState(st,'',path+location.search);
      else history.pushState(st,'',path+location.search);
    };
    d.addEventListener('close',function(){
      if(!isRoute(location.pathname))return;
      if(history.state&&history.state.pg)history.back();
      else history.replaceState(null,'','/'+location.search);
    });
    var bar=document.createElement('div');bar.className='pgbar';
    var b=document.createElement('button');b.type='button';b.className='pgback';b.tabIndex=-1;b.setAttribute('aria-label','Back');
    b.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
    b.onclick=function(){d.close()};
    var lg=document.createElement('a');lg.href='/';lg.className='pglogo';lg.textContent='mazalmk';
    bar.appendChild(b);bar.appendChild(lg);d.insertBefore(bar,d.firstChild);
  }
  patch(F,function(){return '/post'});
  patch(A,function(){return window.mode=='reg'?'/register':'/login'});
  patch(C,function(){return '/account'});
  patch(S,function(){return '/search'});
  window.addEventListener('popstate',function(){
    if(!isRoute(location.pathname)){[F,A,C,S].forEach(function(d){if(d.open)d.close()})}
    else if(!F.open&&!A.open&&!C.open&&!S.open){history.replaceState(null,'','/'+location.search)}
  });
  /* opened directly at /post, /login or /register */
  var path=location.pathname;
  if(isRoute(path)){
    history.replaceState(null,'','/'+location.search);
    var n=0,t=setInterval(function(){
      if(typeof lastUid!=='undefined'||++n>40){
        clearInterval(t);
        if(path=='/post')startPost();
        else if(path=='/search')openSearch();
        else if(path=='/account'){if(window.U)openAcc();else authOpen('login')}
        else if(!window.U)authOpen(path=='/register'?'reg':'login');
      }
    },100);
  }
})();
</script>
