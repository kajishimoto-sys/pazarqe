.specs{display:flex;flex-wrap:wrap;gap:6px}

.btn.ic{padding:7px 11px}

.nb{position:absolute;top:12px;left:52px;background:#d6336c;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px}

<body>
<header><div class="bar">
  <a class="logo" id="brand" href="/">🛒 Пазарче</a>
  <select class="lang" id="lang" aria-label="Language"><option value="mk">МК</option><option value="sq">SQ</option><option value="en">EN</option></select>
  <a class="btn ghost" id="adm" href="/admin.html" hidden>Admin</a>
  <button class="btn ghost ic" id="hfav" hidden aria-label="Saved">♡ <span id="hfn">0</span></button>
  <button class="btn ghost ic" id="acct" hidden>👤<span class="nm" id="acn"></span></button>
  <button class="btn ghost" id="login"></button><button class="btn ghost" id="reg"></button><button class="btn" id="post"></button>
  <form class="search" id="sf" onsubmit="return false"><input id="q" type="search" enterkeyhint="search" autocomplete="off"></form>
</div></header>
<main>
  <section class="hero"><div><h1 id="heroT"></h1><p id="heroP"></p></div><button class="btn" id="hpost"></button></section>
  <div class="cats" id="tabs"></div>
  <div class="cats" id="cats"></div>
  <div class="fbar"><button type="button" class="chip ftog" id="ftog" aria-expanded="false" aria-controls="filters"></button><button type="button" class="fclr" id="fclr" hidden></button><span class="count" id="count"></span><button type="button" class="vt" id="vtog"></button></div>
  <div class="filters" id="filters">
    <select id="city" aria-label="City"></select>
    <input id="min" type="number" min="0" inputmode="numeric">
    <input id="max" type="number" min="0" inputmode="numeric">
    <select id="sort" aria-label="Sort"></select>
    <select id="cond" aria-label="Condition"></select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer class="foot"><div class="fl" id="fl"></div><div id="fc"></div></footer>
<button class="btn fab" id="fab"></button>

<dialog id="view"><div class="dlg" id="vbody"></div></dialog>
<dialog id="acc"><div class="dlg acc">
  <h2 data-t="accT"></h2>
  <p class="meta" id="accmail" style="margin:0"></p>
  <div class="row"><button type="button" class="chip" id="accmine"></button><button type="button" class="chip" id="accfav"></button></div>
  <form id="pfrm">
    <h3 data-t="profile"></h3>
    <label><span data-t="name"></span><input name="name" id="accname" maxlength="40" autocomplete="name"></label>
    <label><span data-t="defPhone"></span><input name="phone" id="accphone" type="tel" autocomplete="tel" maxlength="20"></label>
    <div class="actions"><button class="btn alt" data-t="saveProf"></button></div>
  </form>
  <form id="pwf">
    <h3 data-t="secT"></h3>
    <label><span data-t="newPass"></span><input id="accpw" type="password" minlength="6" autocomplete="new-password" required></label>
    <div class="actions"><button class="btn alt" data-t="chPass"></button></div>
  </form>
  <form id="emf">
    <label><span data-t="newEmail"></span><input id="accem" type="email" autocomplete="email" required></label>
    <div class="actions"><button class="btn alt" data-t="chEmail"></button></div>
  </form>
  <p class="meta" id="accerr" role="alert" style="margin:0;color:#c0392b"></p>
  <div class="actions"><button type="button" class="btn ghost" id="accclose" data-t="close" style="color:var(--ink)"></button><button type="button" class="btn ghost" id="accout" data-t="logout" style="color:var(--ink)"></button></div>
  <button type="button" class="btn ghost bad" id="accdel" data-t="delAcc"></button>
</div></dialog>
<dialog id="rec"><form class="dlg" id="rcf" method="dialog">
  <h2 data-t="newPassT"></h2>
  <label><span data-t="newPass"></span><input name="np" id="np" type="password" minlength="6" autocomplete="new-password" required></label>
  <p class="meta" id="rcerr" role="alert" style="margin:0;color:#c0392b"></p>
  <div class="actions"><button class="btn alt" id="rcsave"></button></div>
</form></dialog>
<dialog id="form"><form class="dlg" id="pf" method="dialog">
  <h2 id="ptitle"></h2>
  <label><span data-t="title"></span><input name="title" required minlength="3" maxlength="70"></label>
  <div class="row">
    <label><span data-t="category"></span><select name="cat" id="pcat"></select></label>
    <label><span data-t="city"></span><select name="city" id="pcity"></select></label>
  </div>
  <div class="row">
    <label><span data-t="priceEur"></span><input name="price" type="number" inputmode="decimal" min="0" max="100000000" required></label>
    <label><span data-t="phone"></span><input name="phone" type="tel" autocomplete="tel" placeholder="07x xxx xxx" minlength="6" maxlength="20" required></label>
  </div>
  <div class="row" id="xf"></div>
  <div class="row"><label><span data-t="cond"></span><select name="cond" id="pcond"></select></label><label><span data-t="photo"></span><input name="photo" id="pphoto" type="file" accept="image/*" multiple></label></div>
  <div class="pics" id="pics"></div>
  <label><span data-t="desc"></span><textarea name="desc" rows="3" maxlength="2000"></textarea></label>
  <div class="actions"><button type="button" class="btn ghost" id="cancel" style="color:var(--ink)"></button><button class="btn alt" id="publish"></button></div>
</form></dialog>

<dialog id="rep"><form class="dlg" id="rf" method="dialog">
  <h2 data-t="reportT"></h2>
  <label><span data-t="reason"></span><select name="reason" id="rreason"></select></label>
  <label><span data-t="note"></span><textarea name="note" rows="2" maxlength="500"></textarea></label>
  <div class="actions"><button type="button" class="btn ghost" id="rcancel" style="color:var(--ink)"></button><button class="btn alt" id="rsend"></button></div>
</form></dialog>
<dialog id="auth"><form class="dlg" id="af" method="dialog">
  <h2 id="atitle"></h2>
  <label id="nameL"><span data-t="name"></span><input name="name" id="aname" maxlength="40" autocomplete="name"></label>
  <label><span data-t="email"></span><input name="email" id="aemail" type="email" autocomplete="email" inputmode="email" required></label>
  <label><span data-t="pass"></span><input name="pass" id="apass" type="password" minlength="6" autocomplete="current-password" required></label>
  <p class="meta" id="aerr" role="alert" style="margin:0;color:#c0392b"></p>
  <button type="button" id="aswitch" class="btn ghost" style="color:var(--brand);border:0;justify-content:flex-start"></button>
  <button type="button" id="aforgot" class="btn ghost" style="color:var(--brand);border:0;justify-content:flex-start"></button>
  <div class="actions"><button type="button" class="btn ghost" id="acancel" style="color:var(--ink)"></button><button class="btn alt" id="asubmit"></button></div>
</form></dialog>

$('rf').onsubmit=async function(e){
  e.preventDefault();
  if(!U||!RT){$('rep').close();return}
  var note=String(new FormData($('rf')).get('note')||'').trim()||null;
  var r=await sb.from('reports').insert({listing_id:RT.id,reason:$('rreason').value,note:note});
  $('rep').close();$('rf').reset();
  toast(r.error?(r.error.code=='23505'?T[L].dup:T[L].err):T[L].reported);
};

/* ───── start ───── */
(function(){
  var qp=new URLSearchParams(location.search),pc=qp.get('cat');
  if(CATS.some(function(c){return c[0]==pc}))cat=pc;
  ['edit','report','fav'].forEach(function(k){var v=qp.get(k);if(v&&/^[0-9a-f-]{36}$/i.test(v))PEND={act:k,id:v}});
})();
labels();render();
if(sb){
  sb.auth.onAuthStateChange(function(ev,s){
    var u=s&&s.user;
    U=u?{id:u.id,e:u.email,name:(u.user_metadata&&u.user_metadata.name)||String(u.email).split('@')[0],phone:(u.user_metadata&&u.user_metadata.phone)||''}:null;
    var uid=U?U.id:null,changed=uid!==lastUid;lastUid=uid;
    /* run outside the callback: calling Supabase from inside it can deadlock */
    setTimeout(function(){
      if(!U&&(view=='mine'||view=='fav'))view='all';
      labels();
      if(changed){
        load();loadFavs();
        $('adm').hidden=true;
        if(U)sb.rpc('is_admin').then(function(r){$('adm').hidden=!(r&&r.data===true)});
      }
      if(ev=='PASSWORD_RECOVERY'){if($('auth').open)$('auth').close();$('rec').showModal()}
    },0);
  });
}
</script>
</body>
</html>
