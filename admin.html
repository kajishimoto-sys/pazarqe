<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f3b30">
<title>mazalmk – Admin</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#fdf8ee;--surface:#fff;--ink:#14231f;--mute:#5d6e68;--line:#e9e1d3;--brand:#0f3b30;--brand-ink:#f7f1e3;--tag:#e85d0a;--tag-ink:#fff;--bad:#c0392b;--ok:#1e8449;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--surface:#182521;--ink:#e8f1ed;--mute:#97aaa3;--line:#2a3b35;--brand:#5fcdb0;--brand-ink:#082019;--tag:#f0731f;--bad:#ff7b6b;--ok:#5fd18c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
header{background:var(--brand);color:var(--brand-ink);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;margin-right:auto}
header a{color:inherit}
main{max-width:1000px;margin:auto;padding:14px 14px 60px}
.btn{border:0;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:700;background:var(--tag);color:var(--tag-ink);text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.55;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
.stat.alert b{color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:6px}
.item.done{opacity:.6}
.item h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.pill.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.pill.top{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.note{background:var(--bg);border-left:3px solid var(--line);padding:6px 10px;border-radius:4px;font-size:14px;overflow-wrap:anywhere}
.thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--bg);flex:none}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px}
.login label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.login input{padding:10px;min-height:42px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.err{color:var(--bad);margin:0;min-height:1.4em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;max-width:92vw;text-align:center}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><h1>mazalmk · Admin</h1><a class="btn ghost sm" href="/">← Site</a><button class="btn ghost sm" id="out" hidden>Log out</button></header>
<main id="app"></main>

<script>
var SUPABASE_URL='https://ttqaswutuhswrjyocbcv.supabase.co';
var SUPABASE_KEY='sb_publishable_LxYBkR8o93P7tgUpu7dAMQ_bo3BCq1c';
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

var REASONS={r1:'Scam or fake listing',r2:'Wrong category',r3:'Already sold',r4:'Prohibited item'};
var CATN={car:'Vehicles',home:'Real estate',tech:'Electronics',house:'Home & garden',fash:'Fashion',job:'Jobs',serv:'Services',pet:'Pets',part:'Auto parts',mach:'Machinery',appl:'Appliances',kids:'Toys & baby',sport:'Sports',build:'Building materials'};
var tab='reports',busy=false;

function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function toast(m,ms){var e=el('div','toast',m);document.body.appendChild(e);setTimeout(function(){e.remove()},ms||2400)}
function when(s){if(!s)return'never';var d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function btn(label,cls,fn){var b=el('button','btn sm '+(cls||''),label);b.type='button';b.onclick=async function(){if(b.disabled)return;b.disabled=true;try{await fn()}catch(e){toast('Failed: '+((e&&e.message)||e))}finally{b.disabled=false}};return b}
function photoPaths(urls){var o=[];(urls||[]).forEach(function(u){var p=String(u).split('/listing-photos/')[1];if(p){p=decodeURIComponent(p);o.push(p);o.push(p.replace(/\.jpg$/,'_t.jpg'))}});return o}
async function rpc(name,args){var r=await sb.rpc(name,args||{});if(r.error)throw r.error;return r.data}

/* ───── screens ───── */
function showLogin(msg){
  $('out').hidden=true;var app=$('app');app.textContent='';
  var f=el('form','login');f.appendChild(el('h2','','Admin login'));f.querySelector('h2').style.margin='0';
  function field(label,type,name,ac){var l=el('label');l.appendChild(el('span','',label));var i=document.createElement('input');i.type=type;i.name=name;i.required=true;i.autocomplete=ac;l.appendChild(i);f.appendChild(l)}
  field('Email','email','email','email');field('Password','password','pass','current-password');
  var err=el('p','err',msg||'');err.setAttribute('role','alert');f.appendChild(err);
  var go=el('button','btn','Log in');f.appendChild(go);
  f.onsubmit=async function(e){e.preventDefault();go.disabled=true;err.textContent='';
    var r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pass.value});
    go.disabled=false;if(r.error){err.textContent='Wrong email or password';return}
    start()};
  app.appendChild(f);
}
function showDenied(email){
  $('out').hidden=false;var app=$('app');app.textContent='';
  var box=el('div','login');box.appendChild(el('h2','','Not an admin'));box.firstChild.style.margin='0';
  box.appendChild(el('p','meta','You are signed in as '+email+', but this account is not an admin. If you just ran the "make yourself admin" SQL, make sure the email in it is exactly this one.'));
  app.appendChild(box);
}

async function start(){
  var s=await sb.auth.getSession();var u=s.data.session&&s.data.session.user;
  if(!u){showLogin();return}
  var ov;
  try{ov=await rpc('admin_overview')}catch(e){
    if(/not admin/i.test(e.message||''))showDenied(u.email);
    else{showLogin('Could not load: '+(e.message||e)+' (did you run migration-3.sql?)')}
    return}
  $('out').hidden=false;
  var app=$('app');app.textContent='';
  var st=el('div','stats');
  [['Open reports',ov.open_reports,ov.open_reports>0],['Listings',ov.listings],['New listings (7d)',ov.new_listings_7d],['Hidden listings',ov.hidden],['Users',ov.users],['New users (7d)',ov.new_users_7d],['Banned users',ov.banned]].forEach(function(x){
    var d=el('div','stat'+(x[2]?' alert':''));d.appendChild(el('b','',String(x[1])));d.appendChild(el('span','',x[0]));st.appendChild(d)});
  app.appendChild(st);
  var tabs=el('div','tabs');
  [['reports','Reports'],['listings','Listings'],['users','Users']].forEach(function(t){
    var b=el('button','tab',t[1]);b.setAttribute('aria-pressed',tab==t[0]);b.onclick=function(){tab=t[0];start()};tabs.appendChild(b)});
  app.appendChild(tabs);
  var body=el('div');app.appendChild(body);
  if(tab=='reports')await reportsTab(body);else if(tab=='listings')await searchTab(body,listingsList,'Search title or owner email…');else await searchTab(body,usersList,'Search user email…');
}

/* ───── reports ───── */
async function reportsTab(box){
  var rows=await rpc('admin_list_reports');
  if(!rows.length){box.appendChild(el('div','empty','No reports yet.'));return}
  rows.forEach(function(r){
    var c=el('div','item'+(r.resolved?' done':''));
    var top=el('div','row');top.appendChild(el('h3','',r.listing_title));
    top.appendChild(el('span','pill',REASONS[r.reason]||r.reason));
    if(r.listing_hidden||r.listing_reports>=3)top.appendChild(el('span','pill bad','hidden'));
    if(r.resolved)top.appendChild(el('span','pill','resolved'));
    c.appendChild(top);
    c.appendChild(el('div','meta',r.listing_reports+' report(s) on this listing · owner '+(r.owner_email||'?')+' · reported by '+(r.reporter_email||'?')+' · '+when(r.created_at)));
    if(r.note)c.appendChild(el('div','note',r.note));
    var a=el('div','row');
    var v=el('a','btn sm ghost','View');v.href='/oglas/'+encodeURIComponent(r.listing_id);v.target='_blank';v.rel='noopener';a.appendChild(v);
    a.appendChild(btn(r.resolved?'Reopen':'Dismiss report','ghost',async function(){await rpc('admin_resolve_report',{p_id:r.id,p_resolved:!r.resolved});start()}));
    a.appendChild(btn(r.listing_hidden?'Unhide':'Hide listing','ghost',async function(){await rpc('admin_set_hidden',{p_id:r.listing_id,p_hidden:!r.listing_hidden});toast('Done');start()}));
    a.appendChild(btn('Delete listing','bad',function(){return delListing(r.listing_id,r.listing_title)}));
    a.appendChild(btn('Ban owner','bad',function(){return ban(r.owner_id,r.owner_email,true)}));
    c.appendChild(a);box.appendChild(c);
  });
}

/* ───── listings ───── */
async function listingsList(box,q){
  var rows=await rpc('admin_list_listings',{p_search:q});
  if(!rows.length){box.appendChild(el('div','empty','No listings found.'));return}
  rows.forEach(function(l){
    var c=el('div','item'),top=el('div','row');
    if(l.image_url){var im=el('img','thumb');im.alt='';im.loading='lazy';im.src=l.image_url.replace(/\.jpg$/,'_t.jpg');im.addEventListener('error',function(){im.src=l.image_url},{once:true});top.appendChild(im)}
    var t=el('div');t.style.flex='1';t.style.minWidth='0';t.appendChild(el('h3','',l.title));
    t.appendChild(el('div','meta',(Number(l.price)?Number(l.price).toLocaleString('en-GB')+' €':'Free')+' · '+(CATN[l.category]||l.category)+' · '+l.owner_email+' · '+when(l.created_at)));
    top.appendChild(t);c.appendChild(top);
    var p=el('div','row');
    if(l.is_top)p.appendChild(el('span','pill top','TOP'));
    if(l.hidden)p.appendChild(el('span','pill bad','hidden'));
    if(l.report_count)p.appendChild(el('span','pill'+(l.report_count>=3?' bad':''),l.report_count+' report(s)'));
    if(p.children.length)c.appendChild(p);
    var a=el('div','row');
    var v=el('a','btn sm ghost','View');v.href='/oglas/'+encodeURIComponent(l.id);v.target='_blank';v.rel='noopener';a.appendChild(v);
    a.appendChild(btn(l.is_top?'Remove TOP':'Make TOP','ghost',async function(){await rpc('admin_set_top',{p_id:l.id,p_top:!l.is_top});reload()}));
    a.appendChild(btn(l.hidden?'Unhide':'Hide','ghost',async function(){await rpc('admin_set_hidden',{p_id:l.id,p_hidden:!l.hidden});reload()}));
    a.appendChild(btn('Delete','bad',function(){return delListing(l.id,l.title)}));
    c.appendChild(a);box.appendChild(c);
  });
}

/* ───── users ───── */
async function usersList(box,q){
  var rows=await rpc('admin_list_users',{p_search:q});
  if(!rows.length){box.appendChild(el('div','empty','No users found.'));return}
  rows.forEach(function(u){
    var c=el('div','item'),top=el('div','row');top.appendChild(el('h3','',u.email));
    if(u.banned)top.appendChild(el('span','pill bad','banned'));c.appendChild(top);
    c.appendChild(el('div','meta',u.listing_count+' listing(s) · joined '+when(u.created_at)+' · last sign-in '+when(u.last_sign_in_at)));
    var a=el('div','row');
    a.appendChild(btn(u.banned?'Unban':'Ban','bad',function(){return ban(u.id,u.email,!u.banned)}));
    c.appendChild(a);box.appendChild(c);
  });
}

async function searchTab(box,fn,placeholder){
  var f=el('form','search'),i=document.createElement('input');i.type='search';i.placeholder=placeholder;i.value=searchTab.q||'';
  var b=el('button','btn','Search');f.appendChild(i);f.appendChild(b);box.appendChild(f);
  var list=el('div');box.appendChild(list);
  async function go(){searchTab.q=i.value.trim();list.textContent='';try{await fn(list,searchTab.q)}catch(e){list.appendChild(el('div','empty','Failed: '+(e.message||e)))}}
  searchTab.reload=go;f.onsubmit=function(e){e.preventDefault();go()};
  await go();
}
function reload(){if(searchTab.reload)searchTab.reload();toast('Done')}

/* ───── actions ───── */
async function delListing(id,title){
  if(!confirm('Delete "'+title+'" permanently?'))return;
  var urls=await rpc('admin_delete_listing',{p_id:id});
  var ps=photoPaths(urls);if(ps.length)await sb.storage.from('listing-photos').remove(ps);
  toast('Listing deleted');start();
}
async function ban(uid,email,doBan){
  var reason=null;
  if(doBan){reason=prompt('Ban '+email+'?\nAll their listings will be hidden and they cannot post.\n\nReason (optional):');if(reason===null)return}
  else if(!confirm('Unban '+email+'? Their listings will be shown again.'))return;
  await rpc('admin_ban_user',{p_uid:uid,p_ban:doBan,p_reason:reason||null});
  toast(doBan?'User banned':'User unbanned');start();
}

$('out').onclick=async function(){await sb.auth.signOut();showLogin()};
start();
</script>
</body>
</html>
